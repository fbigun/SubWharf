# CNB 流水线：push 到 main 触发 校验 + 自动初始化资源 + 部署到 Cloudflare Workers + 镜像到 GitHub
# 凭据经密钥仓库注入（imports）：
#   cloudflare.yml：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / SESSION_KEY / WRAP_KEY / SETUP_CODE
#   github.yml：GITHUB_TOKEN（GitHub PAT，Contents: Read and write；未配置则跳过 GitHub 同步）
main:
  push:
    - docker:
        image: node:24
      imports:
        - https://cnb.cool/fbigun/secrets/-/blob/main/cloudflare.yml
        - https://cnb.cool/fbigun/secrets/-/blob/main/github.yml
      stages:
        - name: 安装依赖
          script: npm ci --no-audit --no-fund
        - name: 类型检查
          script: npx tsc --noEmit
        - name: 单元测试
          script: npx vitest run
        - name: 确保 KV namespace
          script: node scripts/ensure-kv.mjs
        - name: 部署 Cloudflare Workers
          script: npx wrangler deploy
        - name: 写入 Worker secrets
          script: |
            : "${SESSION_KEY:?密钥仓库缺少 SESSION_KEY}"
            : "${WRAP_KEY:?密钥仓库缺少 WRAP_KEY}"
            : "${SETUP_CODE:?密钥仓库缺少 SETUP_CODE}"
            printf '%s' "$SESSION_KEY" | npx wrangler secret put SESSION_KEY
            printf '%s' "$WRAP_KEY" | npx wrangler secret put WRAP_KEY
            printf '%s' "$SETUP_CODE" | npx wrangler secret put SETUP_CODE
        - name: 同步到 GitHub
          script: |
            if [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "未配置 GITHUB_TOKEN，跳过 GitHub 同步（在密钥仓库 github.yml 中添加）"
              exit 0
            fi
            AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            if ! git -c http.extraheader="AUTHORIZATION: basic $AUTH" push \
              https://github.com/fbigun/SubWharf.git "HEAD:refs/heads/main"; then
              echo "GitHub 推送失败：确认 github.yml 的 GITHUB_TOKEN 对 fbigun/SubWharf 具有 Contents: Read and write 权限"
              exit 1
            fi
            echo "已同步 main 到 GitHub"

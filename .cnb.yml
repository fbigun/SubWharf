# CNB 流水线：push 到 main 并行触发两条独立流水线
#   1) 同步源码到 GitHub：官方 tencentcom/git-sync 插件，同步全部分支与标签（只需 github.yml）
#   2) 校验 + 初始化资源 + 部署 Cloudflare Workers（只需 cloudflare.yml）
# 两条流水线相互独立：任一失败不影响另一条。
# 凭据经密钥仓库注入（imports）：
#   cloudflare.yml：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / SESSION_KEY / WRAP_KEY / SETUP_CODE
#   github.yml：GITHUB_TOKEN（GitHub PAT，Contents: Read and write）
main:
  push:
    - &sync
      name: 同步源码到 GitHub
      docker:
        image: node:24
      imports:
        - https://cnb.cool/fbigun/secrets/-/blob/main/github.yml
      stages:
        - name: 准备全部分支与标签
          script: |
            : "${GITHUB_TOKEN:?密钥仓库 github.yml 缺少 GITHUB_TOKEN}"
            if [ -f .git/shallow ]; then
              git fetch --unshallow origin || true
            fi
            git fetch origin --prune --tags --force
            for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin); do
              case "$ref" in
                refs/remotes/origin/HEAD) continue ;;
              esac
              branch="${ref#refs/remotes/origin/}"
              git update-ref "refs/heads/$branch" "$ref"
            done
            echo "本地分支：$(git for-each-ref --format='%(refname:short)' refs/heads | tr '\n' ' ')"
            echo "本地标签：$(git tag -l | tr '\n' ' ')"
        - name: 同步到 GitHub
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/fbigun/SubWharf.git
            auth_type: https
            username: x-access-token
            password: ${GITHUB_TOKEN}
            push_tags: true
            force: true

    - name: 构建与部署
      docker:
        image: node:24
      imports:
        - https://cnb.cool/fbigun/secrets/-/blob/main/cloudflare.yml
      stages:
        - name: 安装依赖
          script: npm ci --no-audit --no-fund
        - name: 类型检查
          script: npx tsc --noEmit
        - name: 单元测试
          script: npx vitest run
        - name: 确保 KV namespace
          script: node scripts/ensure-kv.mjs
        - name: 部署 Cloudflare Workers
          script: npx wrangler deploy
        - name: 写入 Worker secrets
          script: |
            : "${SESSION_KEY:?密钥仓库缺少 SESSION_KEY}"
            : "${WRAP_KEY:?密钥仓库缺少 WRAP_KEY}"
            : "${SETUP_CODE:?密钥仓库缺少 SETUP_CODE}"
            printf '%s' "$SESSION_KEY" | npx wrangler secret put SESSION_KEY
            printf '%s' "$WRAP_KEY" | npx wrangler secret put WRAP_KEY
            printf '%s' "$SETUP_CODE" | npx wrangler secret put SETUP_CODE

$:
  push:
    - *sync
  tag_push:
    - *sync
